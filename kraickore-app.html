<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KraiCkore</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KraiCkore">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08070c;
    --surface:#121019;
    --surface2:#1a1725;
    --line:#2a2636;
    --acid:#c8ff3d;
    --magenta:#ff2e88;
    --cyan:#2fe6ff;
    --ink:#f4f2fb;
    --muted:#8d879f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    overflow-x:hidden;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:0.02em;text-transform:uppercase;}

  #app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px;background:
    radial-gradient(1200px 400px at 50% -10%, rgba(200,255,61,0.08), transparent 60%),
    var(--bg);}

  /* Top bar */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(8,7,12,0.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:18px 20px 14px;
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  #install-btn{
    display:none;align-items:center;gap:6px;background:var(--acid);color:#0a0a0a;
    border:none;border-radius:20px;padding:8px 14px;font-size:11.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;flex-shrink:0;margin-top:2px;
  }
  .wordmark{display:flex;align-items:baseline;gap:8px;}
  .wordmark .k1{font-family:'Anton',sans-serif;font-size:30px;color:var(--ink);letter-spacing:0.01em;}
  .wordmark .k2{font-family:'Anton',sans-serif;font-size:30px;color:var(--acid);letter-spacing:0.01em;}
  .eq{display:flex;gap:3px;align-items:flex-end;height:14px;margin-left:2px;}
  .eq span{width:3px;background:var(--magenta);display:block;animation:bounce 1.1s ease-in-out infinite;}
  .eq span:nth-child(1){height:40%;animation-delay:0s;}
  .eq span:nth-child(2){height:100%;animation-delay:0.15s;background:var(--cyan);}
  .eq span:nth-child(3){height:65%;animation-delay:0.3s;}
  @keyframes bounce{0%,100%{transform:scaleY(0.4);}50%{transform:scaleY(1);}}
  .tagline{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:0.08em;text-transform:uppercase;}

  section{padding:18px 20px 8px;}
  .section-title{
    font-family:'Anton',sans-serif;font-size:13px;letter-spacing:0.12em;
    color:var(--muted);text-transform:uppercase;margin-bottom:12px;
    display:flex;align-items:center;gap:10px;
  }
  .section-title::after{content:'';flex:1;height:1px;background:var(--line);}

  /* Feed */
  .post{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    margin-bottom:16px;overflow:hidden;
  }
  .post-media{
    height:220px;position:relative;
    display:flex;align-items:flex-end;
    background-size:cover;background-position:center;
  }
  .post-media::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.75));}
  .post-tag{
    position:relative;z-index:1;margin:14px;font-family:'Anton',sans-serif;
    font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
    background:rgba(8,7,12,0.7);border:1px solid var(--acid);color:var(--acid);
    padding:4px 10px;border-radius:20px;
  }
  .post-body{padding:14px 16px 16px;}
  .post-author{font-size:13px;color:var(--muted);margin-bottom:6px;}
  .post-author b{color:var(--ink);}
  .post-caption{font-size:14.5px;line-height:1.5;margin-bottom:12px;}
  .post-actions{display:flex;gap:14px;align-items:center;}
  .reaction{
    background:var(--surface2);border:1px solid var(--line);border-radius:20px;
    padding:6px 12px;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;
    color:var(--muted);transition:all .15s;user-select:none;
  }
  .reaction.active{border-color:var(--magenta);color:var(--magenta);background:rgba(255,46,136,0.08);}
  .reaction:active{transform:scale(0.95);}
  .comment-toggle{margin-left:auto;font-size:13px;color:var(--cyan);cursor:pointer;}
  .comments{border-top:1px solid var(--line);padding:12px 16px;display:none;}
  .comments.open{display:block;}
  .comment{font-size:13px;margin-bottom:8px;color:var(--muted);}
  .comment b{color:var(--ink);}
  .comment-input{
    display:flex;gap:8px;margin-top:10px;
  }
  .comment-input input{
    flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:20px;
    padding:8px 14px;color:var(--ink);font-size:13px;font-family:'Space Grotesk',sans-serif;
  }
  .comment-input input:focus{outline:none;border-color:var(--cyan);}
  .comment-input button{
    background:var(--acid);border:none;color:#0a0a0a;font-weight:700;font-size:12px;
    padding:0 16px;border-radius:20px;cursor:pointer;text-transform:uppercase;
  }

  /* Events */
  .event-card{
    display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:12px;
  }
  .event-date{
    flex-shrink:0;width:56px;height:56px;border-radius:10px;
    background:var(--surface2);border:1px solid var(--magenta);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .event-date .d{font-family:'Anton',sans-serif;font-size:20px;color:var(--magenta);line-height:1;}
  .event-date .m{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;}
  .event-info{flex:1;}
  .event-info .name{font-weight:700;font-size:15px;margin-bottom:3px;}
  .event-info .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;}
  .pill{
    font-size:10px;text-transform:uppercase;letter-spacing:0.05em;padding:2px 8px;
    border-radius:10px;border:1px solid var(--line);color:var(--cyan);
  }
  .pill.outdoor{border-color:var(--acid);color:var(--acid);}
  .pill.past{color:var(--muted);border-color:var(--line);}

  /* Docs */
  .doc-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    margin-bottom:14px;padding:16px;
  }
  .doc-card .doc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .doc-card .doc-title{font-weight:700;font-size:15px;}
  .doc-card .doc-date{font-size:11px;color:var(--muted);}
  .doc-card p{font-size:13.5px;line-height:1.6;color:#c9c5d8;margin:0 0 10px;}
  .doc-links{display:flex;gap:8px;flex-wrap:wrap;}
  .doc-links span{
    font-size:11px;font-family:'JetBrains Mono',monospace;background:var(--surface2);
    border:1px solid var(--line);padding:5px 10px;border-radius:8px;color:var(--muted);
  }

  /* Links hub */
  .link-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .link-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:18px 14px;text-align:center;cursor:pointer;transition:.15s;
  }
  .link-card:active{transform:scale(0.96);border-color:var(--acid);}
  .link-card .ico{font-size:24px;margin-bottom:8px;}
  .link-card .name{font-weight:700;font-size:13px;}
  .link-card .sub{font-size:10.5px;color:var(--muted);margin-top:2px;}

  /* Updates */
  .update{
    display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);
  }
  .update .dot{width:8px;height:8px;border-radius:50%;background:var(--magenta);margin-top:6px;flex-shrink:0;}
  .update.read .dot{background:var(--line);}
  .update .txt .t{font-size:13.5px;line-height:1.5;}
  .update .txt .ts{font-size:11px;color:var(--muted);margin-top:3px;}

  /* Bottom nav */
  nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;
    background:rgba(18,16,25,0.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex;padding:10px 6px calc(10px + env(safe-area-inset-bottom));
    z-index:30;
  }
  nav button{
    flex:1;background:none;border:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:9.5px;text-transform:uppercase;letter-spacing:0.04em;
    font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;padding:4px 0;
    position:relative;
  }
  nav button .icon{font-size:19px;}
  nav button.active{color:var(--acid);}
  nav button .badge{
    position:absolute;top:-2px;right:22%;background:var(--magenta);color:#fff;
    font-size:9px;border-radius:8px;padding:1px 5px;font-family:'JetBrains Mono',monospace;
  }
  .view{display:none;}
  .view.active{display:block;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <div class="wordmark">
        <span class="k1">KRAIC</span><span class="k2">KORE</span>
        <div class="eq"><span></span><span></span><span></span></div>
      </div>
      <div class="tagline">Ravers · Events · Gig Goers</div>
    </div>
    <button id="install-btn">⬇ Install</button>
  </header>
  <div id="live-banner" style="display:none;margin:10px 20px 0;padding:7px 12px;border:1px solid var(--line);border-radius:20px;font-size:10.5px;font-family:'JetBrains Mono',monospace;text-align:center;"></div>

  <!-- FEED -->
  <div class="view active" id="view-feed">
    <section>
      <div class="section-title">Latest from the floor</div>
      <div id="feed-list"></div>
    </section>
  </div>

  <!-- EVENTS -->
  <div class="view" id="view-events">
    <section>
      <div class="section-title">Upcoming</div>
      <div id="events-upcoming"></div>
      <div class="section-title" style="margin-top:22px;">Past</div>
      <div id="events-past"></div>
    </section>
  </div>

  <!-- DOCS -->
  <div class="view" id="view-docs">
    <section>
      <div class="section-title">Documentation</div>
      <div id="docs-list"></div>
    </section>
  </div>

  <!-- LINKS -->
  <div class="view" id="view-links">
    <section>
      <div class="section-title">Find us elsewhere</div>
      <div class="link-grid" id="links-grid"></div>
    </section>
  </div>

  <!-- UPDATES -->
  <div class="view" id="view-updates">
    <section>
      <div class="section-title">Updates & notifications</div>
      <div id="updates-list"></div>
    </section>
  </div>

  <nav>
    <button data-view="feed" class="active"><span class="icon">◈</span>Feed</button>
    <button data-view="events"><span class="icon">▲</span>Events</button>
    <button data-view="docs"><span class="icon">▤</span>Docs</button>
    <button data-view="links"><span class="icon">✦</span>Links</button>
    <button data-view="updates"><span class="icon">◉</span>Updates<span class="badge" id="update-badge">2</span></button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ============================================================
// SUPABASE CONFIG — fill these in after running schema.sql
// Project → Settings → API → Project URL / anon public key
// ============================================================
const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

let supa = null;
let LIVE = false;
if (SUPABASE_URL !== 'YOUR_SUPABASE_PROJECT_URL' && window.supabase) {
  supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  LIVE = true;
}

function showLiveBanner(connected){
  const b = document.getElementById('live-banner');
  if (!b) return;
  b.style.display = 'block';
  if (connected) {
    b.textContent = '● Connected — events & notifications are live from krew';
    b.style.color = 'var(--acid)'; b.style.borderColor = 'var(--acid)';
  } else {
    b.textContent = '○ Prototype mode — add Supabase credentials in index.html to go live';
    b.style.color = 'var(--muted)'; b.style.borderColor = 'var(--line)';
  }
}

// ---------- MOCK DATA (fallback when Supabase isn't configured) ----------
const gradients = [
  'linear-gradient(135deg,#ff2e88,#7b2ff7)',
  'linear-gradient(135deg,#2fe6ff,#0d1b4c)',
  'linear-gradient(135deg,#c8ff3d,#0f2b0a)',
  'linear-gradient(135deg,#ff8a00,#7b2ff7)',
  'linear-gradient(135deg,#2fe6ff,#c8ff3d)'
];

let posts = [
  {id:1, author:'krew_ryan', tag:'Outdoor · Forest Rave', caption:'Sun came up right as the set peaked. This is why we do it outdoor.', reactions:{'🔥':14,'😍':6,'🌀':3}, active:null, comments:[{u:'nadia_v',t:'been thinking about this one all week'},{u:'oscar__k',t:'the drone shot at the end 🙌'}], g:0},
  {id:2, author:'kraickorekrew', tag:'Indoor · Warehouse 12', caption:'Full lighting rig up and running. Doors at 10.', reactions:{'🔥':22,'😍':9,'🌀':5}, active:null, comments:[{u:'mira.b',t:'the visuals were unreal'}], g:1},
  {id:3, author:'tommo_raves', tag:'Aftermovie clip', caption:'60 seconds of last month, cut from the drone + floor cam footage.', reactions:{'🔥':31,'😍':11,'🌀':8}, active:null, comments:[], g:2},
];

let events = {
  upcoming:[
    {d:'14', m:'Sep', name:'Riverside Sessions', loc:'Outdoor · Riverside Field', type:'outdoor'},
    {d:'28', m:'Sep', name:'Warehouse 12', loc:'Indoor · Unit 4, Industrial Est.', type:'indoor'},
  ],
  past:[
    {d:'02', m:'Aug', name:'Forest Rave Vol. 3', loc:'Outdoor · Ashwood', type:'outdoor', past:true},
    {d:'19', m:'Jul', name:'Basement Sessions', loc:'Indoor · The Old Print Works', type:'indoor', past:true},
  ]
};

let docs = [
  {title:'Forest Rave Vol. 3 — Documentation', date:'Aug 02', body:'Full setup breakdown, the crowd, the artists that came through, and how we handled projections built off our own event footage.', tags:['#setup','#projections','#artists']},
  {title:'Warehouse 12 — Aftermath', date:'Jul 19', body:'The teardown, the cleanup, the pack-up. Plus the drone sky-view video of the site once everything was cleared.', tags:['#teardown','#dronefootage']},
];

let links = [
  {ico:'📸', name:'Instagram', sub:'@kraickore'},
  {ico:'☁️', name:'SoundCloud', sub:'Tracks & mixes'},
  {ico:'🎧', name:'Mixcloud', sub:'Live sets'},
  {ico:'🔥', name:'Hearthis', sub:'Full archive'},
  {ico:'▶️', name:'YouTube', sub:'Aftermovies'},
];

let updates = [
  {t:'Riverside Sessions moved to the lower field — same date, new entrance via the north gate.', ts:'2h ago', read:false},
  {t:'Warehouse 12 tickets now live.', ts:'1d ago', read:false},
  {t:'Forest Rave Vol. 3 aftermovie is up on the Docs tab.', ts:'5d ago', read:true},
];

// ---------- RENDER ----------
function renderFeed(){
  const el = document.getElementById('feed-list');
  el.innerHTML = posts.map(p => `
    <div class="post">
      <div class="post-media" style="background:${gradients[p.g]}">
        <div class="post-tag">${p.tag}</div>
      </div>
      <div class="post-body">
        <div class="post-author"><b>${p.author}</b></div>
        <div class="post-caption">${p.caption}</div>
        <div class="post-actions">
          ${Object.entries(p.reactions).map(([emoji,count]) => `
            <div class="reaction ${p.active===emoji?'active':''}" onclick="react(${p.id},'${emoji}')">${emoji} <span>${count}</span></div>
          `).join('')}
          <div class="comment-toggle" onclick="toggleComments(${p.id})">${p.comments.length} comments</div>
        </div>
      </div>
      <div class="comments" id="comments-${p.id}">
        ${p.comments.map(c => `<div class="comment"><b>${c.u}:</b> ${c.t}</div>`).join('') || '<div class="comment">No comments yet — be first.</div>'}
        <div class="comment-input">
          <input type="text" placeholder="Add a comment..." id="input-${p.id}" onkeydown="if(event.key==='Enter')addComment(${p.id})">
          <button onclick="addComment(${p.id})">Post</button>
        </div>
      </div>
    </div>
  `).join('');
}

function react(id, emoji){
  const p = posts.find(x=>x.id===id);
  if(p.active===emoji){ p.reactions[emoji]--; p.active=null; }
  else{
    if(p.active) p.reactions[p.active]--;
    p.reactions[emoji]++; p.active=emoji;
  }
  renderFeed();
  document.getElementById('comments-'+id).classList.add('open');
}

function toggleComments(id){
  document.getElementById('comments-'+id).classList.toggle('open');
}

function addComment(id){
  const input = document.getElementById('input-'+id);
  if(!input.value.trim()) return;
  const p = posts.find(x=>x.id===id);
  p.comments.push({u:'you', t: input.value.trim()});
  renderFeed();
  document.getElementById('comments-'+id).classList.add('open');
}

async function loadEventsFromSupabase(){
  const { data, error } = await supa
    .from('events')
    .select('*')
    .eq('status', 'published')
    .order('starts_at', { ascending: true });
  if (error || !data) return;
  const now = new Date();
  const mapped = data.map(e => {
    const dt = new Date(e.starts_at);
    return {
      d: String(dt.getDate()).padStart(2,'0'),
      m: dt.toLocaleString('en-US',{month:'short'}),
      name: e.title,
      loc: (e.indoor_outdoor === 'outdoor' ? 'Outdoor · ' : 'Indoor · ') + (e.location_name || ''),
      type: e.indoor_outdoor || 'indoor',
      past: dt < now
    };
  });
  events = { upcoming: mapped.filter(e=>!e.past), past: mapped.filter(e=>e.past) };
  renderEvents();
}

async function loadNotificationsFromSupabase(){
  const { data, error } = await supa
    .from('notifications')
    .select('*')
    .eq('audience', 'public')
    .order('created_at', { ascending: false })
    .limit(20);
  if (error || !data) return;
  updates = data.map(n => ({
    t: n.message,
    ts: timeAgo(new Date(n.created_at)),
    read: false
  }));
  renderUpdates();
}

function timeAgo(date){
  const s = Math.floor((new Date() - date)/1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60)+'m ago';
  if (s < 86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function renderEvents(){
  const up = document.getElementById('events-upcoming');
  const past = document.getElementById('events-past');
  const card = e => `
    <div class="event-card">
      <div class="event-date"><div class="d">${e.d}</div><div class="m">${e.m}</div></div>
      <div class="event-info">
        <div class="name">${e.name}</div>
        <div class="meta">
          <span>${e.loc}</span>
        </div>
        <div style="margin-top:6px;"><span class="pill ${e.type==='outdoor'?'outdoor':''} ${e.past?'past':''}">${e.type}${e.past?' · past':''}</span></div>
      </div>
    </div>`;
  up.innerHTML = events.upcoming.map(card).join('');
  past.innerHTML = events.past.map(card).join('');
}

function renderDocs(){
  document.getElementById('docs-list').innerHTML = docs.map(d => `
    <div class="doc-card">
      <div class="doc-head"><div class="doc-title">${d.title}</div><div class="doc-date mono">${d.date}</div></div>
      <p>${d.body}</p>
      <div class="doc-links">${d.tags.map(t=>`<span>${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

function renderLinks(){
  document.getElementById('links-grid').innerHTML = links.map(l => `
    <div class="link-card" onclick="alert('Would open ${l.name} in a real build.')">
      <div class="ico">${l.ico}</div>
      <div class="name">${l.name}</div>
      <div class="sub">${l.sub}</div>
    </div>
  `).join('');
}

function renderUpdates(){
  document.getElementById('updates-list').innerHTML = updates.map(u => `
    <div class="update ${u.read?'read':''}">
      <div class="dot"></div>
      <div class="txt"><div class="t">${u.t}</div><div class="ts mono">${u.ts}</div></div>
    </div>
  `).join('');
  const unread = updates.filter(u=>!u.read).length;
  document.getElementById('update-badge').style.display = unread ? 'block' : 'none';
  document.getElementById('update-badge').textContent = unread;
}

// ---------- NAV ----------
document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='updates'){ updates.forEach(u=>u.read=true); renderUpdates(); }
  });
});

renderFeed(); renderEvents(); renderDocs(); renderLinks(); renderUpdates();
showLiveBanner(LIVE);

if (LIVE) {
  loadEventsFromSupabase();
  loadNotificationsFromSupabase();

  // realtime: new/updated events and notifications push straight through
  supa.channel('public:events')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, loadEventsFromSupabase)
    .subscribe();

  supa.channel('public:notifications')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, () => {
      loadNotificationsFromSupabase();
      document.getElementById('update-badge').style.display = 'block';
    })
    .subscribe();
}

// ---------- PWA: service worker + install prompt ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

let deferredPrompt = null;
const installBtn = document.getElementById('install-btn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (installBtn) installBtn.style.display = 'flex';
});
if (installBtn) {
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });
}
window.addEventListener('appinstalled', () => {
  if (installBtn) installBtn.style.display = 'none';
});
</script>
</body>
</html>
